<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AnimeX - Decor Anime Cho Góc Phòng Của Bạn</title>
  <meta name="description" content="AnimeX chuyên tranh dán anime, sticker manga, decal decor và phụ kiện dành cho fan anime/manga." />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f14;
      color: #ffffff;
      text-align: center;
    }

    .container {
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 20px;
      max-width: 620px;
      line-height: 1.5;
      color: #e6e6e6;
      margin-bottom: 24px;
    }

    .notice {
      color: #ffcf4a;
      margin-bottom: 32px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .button {
      text-decoration: none;
      color: #111;
      background: #ffffff;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: bold;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      background: #ffcf4a;
    }

    .footer {
      margin-top: 40px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">AnimeX</div>

    <div class="tagline">
      Decor anime cho góc phòng, góc học tập và thế giới riêng của bạn.
    </div>

    <div class="notice">
      Website đang được hoàn thiện.
    </div>

    <div class="buttons">
      <a class="button" href="https://www.tiktok.com/@animex.official">TikTok Shop</a>
      <a class="button" href="https://shopee.vn/animex.store">Shopee</a>
      <a class="button" href="https://www.facebook.com/AnimeX.WorldOfAnime/">Facebook</a>
      <a class="button" href="https://zalo.me/367615919">Zalo</a>
    </div>

    <div class="footer">
      © 2026 AnimeX. All rights reserved.
    </div>
  </main>
</body>
</html>
